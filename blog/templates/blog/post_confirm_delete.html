{% extends 'blog/base.html' %}
{% block title %}Delete Post – NUB Journal{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-5 mx-auto">
    <div class="card shadow-sm border-danger">
      <div class="card-body text-center py-4">
        <h5 class="fw-bold mb-2">Delete Post?</h5>
        <p class="text-muted mb-4">
          Are you sure you want to delete <strong>{{ post.title }}</strong>?
          This action cannot be undone.
        </p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
        </form>
        <a href="{% url 'my_posts' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
