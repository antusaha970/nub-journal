{% extends 'blog/base.html' %}
{% block title %}{{ post.title }} – NUB Journal{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <a href="{% url 'home' %}" class="text-muted text-decoration-none small">&larr; Back to Home</a>
    <h2 class="fw-bold mt-3 mb-1">{{ post.title }}</h2>
    <small class="text-muted">
      By <strong>{{ post.user.username }}</strong> &middot;
      Published {{ post.published_at|date:"d M Y, H:i" }}
    </small>
    <hr />
    <div class="mt-3" style="line-height: 1.8;">{{ post.content|linebreaks }}</div>
  </div>
</div>
{% endblock %}
